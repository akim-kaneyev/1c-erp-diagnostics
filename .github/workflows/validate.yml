name: Validate public release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install validation and pinned optional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openpyxl>=3.1" "pypdf>=5"
          python -m pip install "v8unpack==1.2.6" "opensandbox==0.1.14"

      - name: Verify optional adapter imports and pins
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import v8unpack
          from opensandbox.sandbox import Sandbox

          assert version("v8unpack") == "1.2.6"
          assert callable(v8unpack.extract)
          assert version("opensandbox") == "0.1.14"
          assert Sandbox is not None
          PY

      - name: Compile Python tools
        run: python -m compileall -q tools tests

      - name: Validate plugin and public package
        run: python tools/validate_public_release.py

      - name: Validate skill governance and synchronization
        run: python tools/validate_skills.py

      - name: Verify deterministic SHA-256 skill lock
        run: python tools/update_skill_lock.py --check

      - name: Validate clean publication tree and Git history
        run: python tools/validate_publication_history.py

      - name: Validate unified 1C ecosystem marketplace
        run: python tools/validate_ecosystem_marketplace.py

      - name: Validate executable Gate 0-10 eval suite
        run: python tools/validate_evals.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
