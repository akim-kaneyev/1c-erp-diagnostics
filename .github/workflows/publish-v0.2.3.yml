name: Publish v0.2.3 pre-release

on:
  push:
    branches:
      - ops/publish-v0.2.3
    paths:
      - .github/release/v0.2.3.trigger

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout approved release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 97cebacfe6a8755b89f7fd9231ffdd639febc33c
          fetch-depth: 0
          persist-credentials: true

      - name: Verify v0.2.3 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("plugins/one-c-erp-diagnostics/.codex-plugin/plugin.json")
              .read_text(encoding="utf-8")
          )
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          assert manifest["version"] == "0.2.3"
          assert 'version = "0.2.3"' in pyproject
          assert Path("docs/RELEASE_NOTES_v0.2.3.md").is_file()
          assert Path("docs/PLUGIN_AUDIT_v0.2.3.md").is_file()
          PY
          test "$(git rev-parse HEAD)" = "97cebacfe6a8755b89f7fd9231ffdd639febc33c"

      - name: Create and verify annotated tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.2.3"
          TARGET_SHA="97cebacfe6a8755b89f7fd9231ffdd639febc33c"

          git fetch origin "refs/tags/${VERSION}:refs/tags/${VERSION}" 2>/dev/null || true
          if git show-ref --tags --verify --quiet "refs/tags/${VERSION}"; then
            test "$(git cat-file -t "refs/tags/${VERSION}")" = "tag"
            test "$(git rev-list -n 1 "${VERSION}")" = "${TARGET_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" "${TARGET_SHA}" -m "1C ERP Diagnostics v0.2.3 — Public Preview"
            git push origin "refs/tags/${VERSION}"
          fi

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.2.3"
          TITLE="1C ERP Diagnostics v0.2.3 — Public Preview"
          NOTES="docs/RELEASE_NOTES_v0.2.3.md"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" --prerelease --title "${TITLE}" --notes-file "${NOTES}"
          else
            gh release create "${VERSION}" --verify-tag --prerelease --title "${TITLE}" --notes-file "${NOTES}"
          fi

      - name: Verify published release with repository credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v0.2.3 --json isPrerelease --jq .isPrerelease)" = "true"
          test "$(gh release view v0.2.3 --json tagName --jq .tagName)" = "v0.2.3"
          test -n "$(gh release view v0.2.3 --json url --jq .url)"

      - name: Verify release anonymously
        id: public_verification
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/public-verification.log) 2>&1
          REPO="akim-kaneyev/1c-erp-diagnostics"
          VERSION="v0.2.3"
          BASE="https://raw.githubusercontent.com/${REPO}/${VERSION}"

          echo "Checking public release metadata"
          env -u GH_TOKEN -u GITHUB_TOKEN curl -fsSL --retry 5 \
            "https://api.github.com/repos/${REPO}/releases/tags/${VERSION}" \
            -o /tmp/release.json
          test "$(jq -r .tag_name /tmp/release.json)" = "${VERSION}"
          test "$(jq -r .prerelease /tmp/release.json)" = "true"
          test "$(jq -r .name /tmp/release.json)" = "1C ERP Diagnostics v0.2.3 — Public Preview"

          echo "Checking public tagged documents"
          for path in README.md PRIVACY.md TERMS.md SECURITY.md docs/RELEASE_NOTES_v0.2.3.md; do
            target="/tmp/public-$(echo "${path}" | tr '/' '-')"
            env -u GH_TOKEN -u GITHUB_TOKEN curl -fsSL --retry 5 "${BASE}/${path}" -o "${target}"
            test -s "${target}"
          done
          grep -Fq "version-0.2.3" /tmp/public-README.md
          grep -Fq "v0.2.3" /tmp/public-PRIVACY.md

          echo "Checking public Velis assets"
          env -u GH_TOKEN -u GITHUB_TOKEN curl -fsSL --retry 5 \
            "${BASE}/plugins/one-c-erp-diagnostics/assets/logo.png" -o /tmp/logo.png
          env -u GH_TOKEN -u GITHUB_TOKEN curl -fsSL --retry 5 \
            "${BASE}/plugins/one-c-erp-diagnostics/assets/composer-icon.png" -o /tmp/composer-icon.png
          test -s /tmp/logo.png
          test -s /tmp/composer-icon.png
          test "$(head -c 8 /tmp/logo.png | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"
          test "$(head -c 8 /tmp/composer-icon.png | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"

          echo "Checking public source archives"
          env -u GH_TOKEN -u GITHUB_TOKEN curl -fsSL --retry 5 \
            "https://github.com/${REPO}/archive/refs/tags/${VERSION}.tar.gz" -o /tmp/source.tar.gz
          env -u GH_TOKEN -u GITHUB_TOKEN curl -fsSL --retry 5 \
            "https://github.com/${REPO}/archive/refs/tags/${VERSION}.zip" -o /tmp/source.zip
          tar -tzf /tmp/source.tar.gz > /tmp/tar-list.txt
          unzip -Z1 /tmp/source.zip > /tmp/zip-list.txt
          grep -Fq "/plugins/one-c-erp-diagnostics/.codex-plugin/plugin.json" /tmp/tar-list.txt
          grep -Fq "/docs/RELEASE_NOTES_v0.2.3.md" /tmp/zip-list.txt
          echo "Anonymous public-access verification passed"

      - name: Record verification results in issue 3
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_OUTCOME: ${{ steps.public_verification.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_URL="$(gh release view v0.2.3 --json url --jq .url)"

          RELEASE_MARKER="<!-- v0.2.3-release-verified -->"
          if ! gh issue view 3 --json comments --jq '.comments[].body' | grep -Fq "${RELEASE_MARKER}"; then
            gh issue comment 3 --body "${RELEASE_MARKER}
            ✅ GitHub Actions verified the annotated tag and published pre-release **1C ERP Diagnostics v0.2.3 — Public Preview**.

            - tag: \`v0.2.3\`
            - target commit: \`97cebacfe6a8755b89f7fd9231ffdd639febc33c\`
            - pre-release: \`true\`
            - release: ${RELEASE_URL}"
          fi

          if [ "${PUBLIC_OUTCOME}" = "success" ]; then
            PUBLIC_MARKER="<!-- v0.2.3-public-access-verified -->"
            if ! gh issue view 3 --json comments --jq '.comments[].body' | grep -Fq "${PUBLIC_MARKER}"; then
              gh issue comment 3 --body "${PUBLIC_MARKER}
              ✅ Anonymous public-access verification passed for **v0.2.3** without an authorization token.

              Verified:
              - public GitHub release metadata and pre-release flag;
              - tagged README, PRIVACY, TERMS, SECURITY and release notes;
              - public Velis logo and composer icon PNG files;
              - public \`.tar.gz\` and \`.zip\` source archives and expected package paths."
            fi
          else
            FAILURE_MARKER="<!-- v0.2.3-public-access-failed-attempt-4 -->"
            LOG="$(tail -c 5000 /tmp/public-verification.log 2>/dev/null || true)"
            if ! gh issue view 3 --json comments --jq '.comments[].body' | grep -Fq "${FAILURE_MARKER}"; then
              gh issue comment 3 --body "${FAILURE_MARKER}
              ⚠️ Anonymous public-access verification did not complete on attempt 4.

              \`\`\`text
              ${LOG}
              \`\`\`"
            fi
            exit 1
          fi
